name: Svelte

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "3"

jobs:
  links:
    concurrency:
      group: twiki-links-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Identify the complete content snapshot
        id: content
        run: echo "tree=$(git rev-parse HEAD:content)" >> "$GITHUB_OUTPUT"
      - name: Reuse successful link validation
        id: validation-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/twiki-validation/links
          key: twiki-links-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'twiki.config.json', '.gitmodules', '.github/workflows/svelte.yml', '.github/actions/**', '.github/scripts/**') }}-${{ steps.content.outputs.tree }}
      - name: Check wikilink conventions and destinations
        if: steps.validation-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/validate
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

  build:
    name: Build and deploy
    needs: links
    concurrency:
      group: svelte-build-and-deploy-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    container: ghcr.io/twangodev/twiki-builder:latest
    timeout-minutes: 40
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'validation' }}
    steps:
      - run: git config --global submodule.fetchJobs 8
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || github.token }}
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/*"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: twiki-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: twiki-bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - run: bun run twiki prepare
      - name: Restore encrypted compiler data
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: .twiki/site/build/generated/compiler-cache.gpg
          key: twiki-compiler-encrypted-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'twiki.config.json', '.github/scripts/compiler-cache.ts') }}-${{ github.sha }}
          restore-keys: |
            twiki-compiler-encrypted-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'twiki.config.json', '.github/scripts/compiler-cache.ts') }}-
            twiki-compiler-encrypted-v2-${{ runner.os }}-${{ runner.arch }}-
            twiki-compiler-encrypted-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Decrypt compiler data
        env: &cache-encryption
          BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}
        run: bun .github/scripts/compiler-cache.ts restore
      - run: bun run build
      - name: Deploy Worker and content
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun run twiki exec -- tooling/wrangler.ts d1 migrations apply wisconsin --remote
          bun run deploy
      - name: Encrypt compiler cache
        id: encrypted-cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.compiler-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env: *cache-encryption
        run: bun .github/scripts/compiler-cache.ts save
      - name: Save compiler cache
        if: steps.encrypted-cache.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .twiki/site/build/generated/compiler-cache.gpg
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
